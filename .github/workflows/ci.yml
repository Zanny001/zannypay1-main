name: Mobile CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: yarn
      - run: yarn install --non-interactive
      - name: Capture dependency audit report
        if: always()
        run: yarn audit --json > npm-audit.json || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mobile-npm-audit
          path: npm-audit.json
          if-no-files-found: ignore
      - run: yarn test --runInBand
      - name: Validate Android Expo bundle
        run: yarn expo export --platform android
