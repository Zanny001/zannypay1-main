name: Build ZannyPay Android APK

on:
  workflow_dispatch:
  push:
    tags:
      - "android-v*"

permissions:
  contents: read

jobs:
  build-android-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install

      - name: Validate Expo configuration
        run: npx expo config --type public

      - name: Require Expo build token
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: |
          if [ -z "$EXPO_TOKEN" ]; then
            echo "::error::Add EXPO_TOKEN in GitHub repository Settings > Secrets and variables > Actions."
            exit 1
          fi

      - name: Build installable Android APK with EAS
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: npx eas-cli build --platform android --profile preview --non-interactive --wait --json > eas-build.json

      - name: Download the built APK
        run: |
          BUILD_URL="$(node -e "const b=require('./eas-build.json'); const x=Array.isArray(b)?b[0]:b; process.stdout.write(x?.artifacts?.buildUrl || '')")"
          if [ -z "$BUILD_URL" ]; then
            echo "::error::EAS completed without returning an APK URL."
            exit 1
          fi
          APK_NAME="ZannyPay-$(node -p "require('./app.json').expo.version").apk"
          echo "APK_NAME=$APK_NAME" >> "$GITHUB_ENV"
          curl --fail --location "$BUILD_URL" --output "$APK_NAME"

      - name: Attach APK to this GitHub Actions run
        uses: actions/upload-artifact@v4
        with:
          name: ZannyPay-Android-APK
          path: ${{ env.APK_NAME }}
          if-no-files-found: error
          retention-days: 30

      - name: Publish APK links in workflow summary
        run: |
          BUILD_URL="$(node -e "const b=require('./eas-build.json'); const x=Array.isArray(b)?b[0]:b; process.stdout.write(x?.artifacts?.buildUrl || '')")"
          echo "## ZannyPay Android APK" >> "$GITHUB_STEP_SUMMARY"
          echo "The APK is attached to this GitHub Actions run as the `ZannyPay-Android-APK` artifact." >> "$GITHUB_STEP_SUMMARY"
          echo "[Open EAS build details]($BUILD_URL)" >> "$GITHUB_STEP_SUMMARY"
          echo "Build source: $GITHUB_SHA" >> "$GITHUB_STEP_SUMMARY"
